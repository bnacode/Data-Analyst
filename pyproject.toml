[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analyst-agent"
version = "0.1.0"
description = "Data analysis chat agent for executives over thelook_ecommerce (BigQuery + Gemini)"
requires-python = ">=3.11"

[project.scripts]
analyst = "analyst_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
